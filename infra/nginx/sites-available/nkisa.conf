map $http_upgrade $nkisa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name www.nkisa.com;
    return 301 https://www.nkisa.com$request_uri;
}

server {
    listen 80;
    server_name ctf.nkisa.com;
    return 301 https://ctf.nkisa.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.nkisa.com;

    ssl_certificate     /etc/nginx/tls/nkisa.com.pem;
    ssl_certificate_key /etc/nginx/tls/nkisa.com.key;

    root /var/www/nkisa/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl;
    server_name ctf.nkisa.com;

    ssl_certificate     /etc/nginx/tls/ctf.nkisa.com.pem;
    ssl_certificate_key /etc/nginx/tls/ctf.nkisa.com.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nkisa_connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name mail.nkisa.com;
    return 301 https://mail.nkisa.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mail.nkisa.com;

    ssl_certificate     /etc/nginx/tls/mail.nkisa.com.pem;
    ssl_certificate_key /etc/nginx/tls/mail.nkisa.com.key;

    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 503 "邮件服务筹备中。\n";
}
